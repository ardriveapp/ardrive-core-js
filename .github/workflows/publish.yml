name: Publish to npm

# Publishes ardrive-core-js to npm.
#   - PUBLISH: push a version tag `vX.Y.Z` (the ONLY path that publishes; gated by the version check).
#   - VALIDATE: run manually (workflow_dispatch) to build + pack + verify — never publishes.
#
# Auth: npm Trusted Publishing (OIDC) — no token/secret. One-time owner setup on
# npm: the ardrive-core-js package -> Settings -> Trusted Publishers -> add a
# GitHub Actions publisher for ardriveapp/ardrive-core-js + workflow publish.yml.
# Requires npm >= 11.5.1, Node >= 22.14.0, and `id-token: write` (all set below).
#
# Why this exists: `npm publish` runs the `prepare` hook (tsc -> lib/) but does
# NOT build the browser bundle `dist/web/`, which the package's `files` array
# ships. Publishing without `yarn build:web` produces a package with a stale or
# missing web bundle. This workflow always builds BOTH and verifies the tarball
# contains them before publishing, so a broken package can't go out.

on:
  push:
    tags:
      # vX.Y.Z (and prereleases like vX.Y.Z-rc.1). The "verify tag matches
      # package.json" step below is the real guard on which version publishes;
      # this just gates the workflow to version-shaped tags. Uses only `*`
      # (unambiguous in GitHub's filter-pattern syntax) rather than a
      # `[0-9]+`-style pattern that reads like regex.
      - "v*.*.*"
  workflow_dispatch: {} # manual run: build + pack + verify only; never publishes (publish = tag push)

permissions:
  contents: read
  id-token: write # enables npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0" # OIDC trusted publishing needs Node >= 22.14.0 (repo .nvmrc is 18)
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22's bundled npm is older.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@11.5.1 # exact OIDC minimum; npm@latest (12.x) requires Node >= 22.22
          # Fail closed if the pinned npm didn't actually install (supply-chain integrity).
          test "$(npm --version)" = "11.5.1" || { echo "::error::npm is $(npm --version), expected 11.5.1"; exit 1; }

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Node bundle (lib/)
        run: yarn build

      - name: Build web bundle (dist/web/)
        run: yarn build:web

      # Tag pushes must match package.json's version, or we'd publish the wrong number.
      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json ($PKG_VERSION). Bump package.json or fix the tag."
            exit 1
          fi
          echo "Version OK: ${GITHUB_REF_NAME}"

      # Guard the dist/web gotcha: the tarball MUST carry both bundles.
      - name: Verify packaged contents (lib/ AND dist/web/)
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map(f => f.path);
            const hasLib = files.some(f => f.startsWith("lib/") && f.endsWith("exports.js"));
            const hasWeb = files.some(f => f.startsWith("dist/web/"));
            if (!hasLib) { console.error("::error::lib/exports.js missing from package"); process.exit(1); }
            if (!hasWeb) { console.error("::error::dist/web/ missing from package — build:web did not run"); process.exit(1); }
            console.log(`Package OK: ${files.length} files, lib/ + dist/web/ present`);
          '

      - name: Publish to npm (trusted publishing / OIDC)
        # Publish ONLY on a version-tag push, which passes through the "Verify tag
        # matches package.json version" gate above. workflow_dispatch NEVER publishes
        # (build/pack/verify only) — closes the tag/version-check bypass CodeRabbit flagged.
        if: github.event_name == 'push'
        # No NODE_AUTH_TOKEN — authenticated via OIDC against the npm Trusted
        # Publisher configured for this repo + workflow. Provenance is generated
        # automatically under trusted publishing (no --provenance flag needed).
        run: npm publish --access public

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch'
        run: echo "Validation complete — built, packed, and verified. workflow_dispatch never publishes; push a vX.Y.Z tag to publish."
